plugin:
  name: custom-data-type-cerlthesaurus
  version: 2.0
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-cerlthesaurus
  displayname:
    de-DE: CERL-Thesaurus-Verknüpfung
    en-US: CERL-Thesaurus-Referencing
  info:
    de-DE: |
      Stellt einen eigenen Feldtyp bereit, mit dem Datensätze mit Einträgen des [CERL-Thesaurus](https://data.cerl.org/) verknüpft werden – der Normdatei des Consortium of European Research Libraries (CERL). So hinterlegen Sie eine eindeutige Referenz im Feld, statt Namen als Freitext zu erfassen.

      - Vorschläge während der Eingabe über den GBV-Suggest-Dienst
      - Ein Feld optional auf Personen-, Körperschafts-, Erscheinungsorts- oder Ortsnamen beschränken
      - Optionaler automatischer Updater hält die gespeicherten Daten mit der Quelle synchron
    en-US: |
      Adds a custom data type for linking records to entities of the [CERL Thesaurus](https://data.cerl.org/), the authority file of the Consortium of European Research Libraries (CERL). Attach an authoritative reference to a field instead of typing names as free text.

      - Type-ahead suggestions from the GBV suggest service
      - Optionally restrict a field to personal, corporate, imprint or place names
      - Optional automatic updater keeps stored data in sync with the source
  l10n: l10n/customDataTypeCERLThesaurus.csv
  webfrontend:
    url: customDataTypeCERLThesaurus.js
    css: customDataTypeCERLThesaurus.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"

custom_types:
  cerlthesaurus:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      mask:
        - name: allow_placename
          parameters:
            value:
              type: bool
        - name: allow_imprintname
          parameters:
            value:
              type: bool
        - name: allow_personalname
          parameters:
            value:
              type: bool
        - name: allow_corporatename
          parameters:
            value:
              type: bool

    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/CERLThesaurusUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1

base_config:
  - name: update_cerlthesaurus
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 24
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 24
        position: 2
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 3
